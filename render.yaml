services:
  # Backend — FastAPI
  - type: web
    name: learnnest-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: learnnest-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 30
      - key: FRONTEND_ORIGIN
        value: https://learnnest.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false

  # Frontend — React
  - type: web
    name: learnnest
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://learnnest-api.onrender.com

databases:
  - name: learnnest-db
    plan: free